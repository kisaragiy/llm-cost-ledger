name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest
        run: pytest tests/ -q

  claims:
    name: 可证伪声明验证
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      # README 里的每条声明在这里跑一遍；对不上就红
      - name: 验证 README 可证伪声明
        run: python scripts/verify_claims.py

  docker:
    name: 镜像构建与健康检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker build -t llm-cost-ledger:ci .
      - name: 起容器并验证健康检查
        run: |
          docker run -d --name ledger-ci \
            -e UPSTREAM_BASE_URL=http://127.0.0.1:1 \
            -e UPSTREAM_API_KEY=dead \
            -e PROXY_AUTH_KEY= \
            -p 8790:8790 llm-cost-ledger:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8790/health > /tmp/health.json; then
              echo "健康检查通过：$(cat /tmp/health.json)"
              break
            fi
            [ "$i" -eq 30 ] && { echo "健康检查超时"; docker logs ledger-ci; exit 1; }
            sleep 2
          done
      - name: 容器内跑对账（干净库应为 0）
        run: docker exec ledger-ci python -m llm_cost_ledger --db /tmp/clean.db reconcile
      - name: 容器日志
        if: always()
        run: docker logs ledger-ci
      - name: 清理
        if: always()
        run: docker rm -f ledger-ci || true
